[project]
name = "cherrypulse-kr"
version = "0.1.0"
description = "Board-based pattern trading with REST and WebSocket integrations"
requires-python = ">=3.15,<3.16"
dependencies = [
  "pydantic==2.14.2",
  "typing-extensions==4.16.0",
]

[tool.uv]
package = false
required-version = "==0.12.13"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py315"
extend-exclude = ["back", ".tools", ".uv-cache"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "EM101"] # Error codes are structured LedgerError fields.

[tool.basedpyright]
typeCheckingMode = "all"
include = ["execution", "tests"]
pythonVersion = "3.15"
pythonPlatform = "Windows"
exclude = ["back", ".tools", ".uv-cache", ".venv"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "ARG", "INP001"]
"check.py" = ["T201"] # 진행 체크 스크립트: stdout 출력이 목적.
"notifications/telegram.py" = ["ARG002", "PLR0913", "PLR0917"] # 리다이렉트 거절이 urllib 핸들러 시그니처를 그대로 유지.
"tools/inspect_kiwoom_realtime.py" = ["T201", "PLC0415"] # ActiveX 관측 도구: stdout 출력과 검증 후 지연 import가 목적.
