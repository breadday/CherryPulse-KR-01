name: REST migration verification
on:
  push:
    branches: [main, refactor/kiwoom-rest, feature/rest-auth-stream]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pytest==9.1.1 ruff==0.16.7 basedpyright==1.40.2
      - run: python -m pip install -r tools/requirements-rest-probes.txt
      - run: python tools/verify_rest_migration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-offline-verification
          path: results/rest-migration-verification.json
  windows-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==9.1.1 pydantic==2.13.5 typing-extensions==4.16.0
      - run: python -m pip install -r tools/requirements-rest-probes.txt
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp=results/ci-pytest
      - run: python -m execution
