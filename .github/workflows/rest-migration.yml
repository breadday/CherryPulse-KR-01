name: REST migration verification
on:
  push:
    branches: [main, refactor/kiwoom-rest, feature/rest-auth-stream]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reservation-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify PIN controls and reservation dry runs in an isolated database
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/dry_run_setup.sql
          for migration in supabase/migrations/*.sql; do
            case "$migration" in *schedule_dry_runs.sql) continue ;; esac
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/account_device_pairing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/pin_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/dry_run_fixtures.sql
          python supabase/tests/reservation_tick_check.py
          psql -v ON_ERROR_STOP=1 -f supabase/tests/owner_pin_recovery.sql
  offline-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pytest==9.1.1 ruff==0.16.7 basedpyright==1.40.2
      - run: python -m pip install -r tools/requirements-rest-probes.txt
      - run: node --test cloud/worker.test.mjs web/board/*.test.js
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python tools/verify_rest_migration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-offline-verification
          path: results/rest-migration-verification.json
  windows-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install pytest==9.1.1 pydantic==2.14.2 typing-extensions==4.16.0
      - run: python -m pip install -r tools/requirements-rest-probes.txt
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp=results/ci-pytest
      - run: python -m execution
