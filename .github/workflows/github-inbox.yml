name: GitHub inbox recovery
on:
  pull_request:
    paths:
      - 'tools/github_inbox/**'
      - 'docs/GITHUB-INBOX-*.md'
      - '.github/workflows/github-inbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inbox-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inbox unit and subprocess recovery tests (no AI or network calls)
        run: python -B -m unittest discover -s tools/github_inbox -p "test_*.py" -v
